name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle (unsigned)
        run: SIGN_IDENTITY=- Scripts/bundle.sh
