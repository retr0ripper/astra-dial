name: Release

# Push a tag matching VERSION (for example v0.3.0) to build, sign, notarize and publish a
# release and update the Homebrew tap. Needs these repository secrets:
#   DEVELOPER_ID_P12           base64 of the Developer ID Application certificate + key (.p12)
#   DEVELOPER_ID_P12_PASSWORD  the .p12's password
#   APPLE_ID                   Apple ID email used for notarization
#   APPLE_TEAM_ID              the Developer ID team ID
#   APPLE_APP_PASSWORD         an app-specific password for that Apple ID
#   TAP_TOKEN                  a token that can push to retr0ripper/homebrew-tap

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Skips cleanly when the secrets aren't set up yet, or when the release already exists
  # (made locally with `make release`).
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SECRETS: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.TAP_TOKEN != '' }}
        run: |
          if [[ "$HAS_SECRETS" != true ]]; then
            echo "::notice::Release secrets aren't set; skipping. See the top of release.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME is already released; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Check the tag matches VERSION
        run: |
          [[ "${GITHUB_REF_NAME}" == "v$(cat VERSION)" ]] || { echo "Tag ${GITHUB_REF_NAME} doesn't match VERSION $(cat VERSION)"; exit 1; }

      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Test
        run: swift test

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials astra-dial \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --keychain "$RUNNER_TEMP/signing.keychain-db"

      - name: Build, sign and notarize
        # release.sh staples and validates the DMG itself.
        run: NOTARY_PROFILE=astra-dial GITHUB_REPO="$GITHUB_REPOSITORY" Scripts/release.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/AstraDial-*.dmg \
            --title "Astra Dial $(cat VERSION)" --generate-notes

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/retr0ripper/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cp build/release/astra-dial.rb "$RUNNER_TEMP/tap/Casks/astra-dial.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "astra-dial $(cat "$GITHUB_WORKSPACE/VERSION")"
          git push

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
